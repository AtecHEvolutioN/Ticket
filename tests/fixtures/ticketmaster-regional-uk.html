<!doctype html>
<!-- Minimal sanitized quick-pick component from the 2026-11-09 UK browser capture.
     The toolbar quantity is a search filter, not observed ticket inventory. -->
<html lang="en"><body><main id="main-content"><div id="list-view"><div id="quickpicks">
  <div role="toolbar" aria-label="Filter results by"><button><span>2 Tickets</span></button><button>All Ticket Types</button></div>
</div><div id="quickpicks-list" role="region" aria-label="Ticket results"><div data-testid="quickpicksList">
  <div role="button" tabindex="0" aria-label="Select Full Price Ticket £40.35, section General Admission" aria-expanded="false">
    <div><dl><div><dt>Section</dt><dd>General Admission</dd></div></dl>
    <div><div data-testid="ticketTypeInfo"><div><div><span>Full Price Ticket</span><span>£40.35 each</span></div></div></div></div></div>
  </div>
</div></div></div></main></body></html>
