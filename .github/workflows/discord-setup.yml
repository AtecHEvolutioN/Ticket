name: Register Discord commands

# Operator initiated only. This workflow never sends a channel message.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-command-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the exact requested main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Register only the Ticket Watch guild command
        # The existing CLI checks for a missing token, verifies that its
        # application matches, and makes no automatic registration retry.
        # Keep the temporary credential scoped to this final step only.
        env:
          DISCORD_APPLICATION_ID: '1569720679757127740'
          DISCORD_GUILD_ID: '1569717598709350491'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_SETUP_BOT_TOKEN }}
        run: node apps/discord/scripts/register-commands.mjs --apply
