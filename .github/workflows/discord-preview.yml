name: Show Discord bot preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-bot-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify preview payload and delivery guards
        run: node --test --test-isolation=none apps/discord/scripts/send-preview.test.mjs
      - name: Post one recorded-evidence preview to bot-status
        env:
          DISCORD_APPLICATION_ID: '1569720679757127740'
          DISCORD_GUILD_ID: '1569717598709350491'
          DISCORD_PREVIEW_CHANNEL_ID: '1569753975182332027'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_SETUP_BOT_TOKEN }}
        run: node apps/discord/scripts/send-preview.mjs --send
