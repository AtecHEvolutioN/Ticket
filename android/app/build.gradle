plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ticketwatch.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'app.ticketwatch.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0-test'
        testInstrumentationRunner 'app.ticketwatch.mobile.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            def localTestKey = rootProject.file('.signing/debug.keystore')
            if (localTestKey.exists()) {
                storeFile localTestKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ''
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}
