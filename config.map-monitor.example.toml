# Run from the repository root. Store the bot token in the environment, never here.
database = "data/ticket.sqlite"
map_database = "data/map-monitor.sqlite"
request_timeout_secs = 45
per_host_interval_secs = 60
blocked_retry_secs = 900
unknown_retry_secs = 120
alert_max_age_secs = 60

[browser]
script = "browser/worker.cjs"
render_wait_ms = 1500
headed = false # Use true on a graphical desktop when needed.
# executable_path = "/usr/bin/chromium"

[discord]
token_env = "DISCORD_BOT_TOKEN"
# channel_id = "YOUR_NUMERIC_CHANNEL_ID"
mention_user_ids = []
mention_role_ids = []

[[map_watches]]
id = "korn-cz-section-110"
name = "KoRn - O2 arena, Prague - section 110"
url = "https://www.ticketmaster.cz/event/korn-vstupenky/1472650657"
section_id = "s_128"
limit = 20
interval_secs = 60
enabled = true
notify_initial = true # Makes the first displayed-price observation reviewable.
notify_price_changes = true
notify_details_changes = true
