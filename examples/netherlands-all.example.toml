# Copy this file to config.nl.local.toml at the repository root.
# Supply TICKETMASTER_API_KEY and DISCORD_BOT_TOKEN privately in the environment.
# This selects all artists returned for NL, not a handpicked artist list.
# Discovery coverage is bounded: 100 events/page, at most 10 pages/query and
# 1,000 retained events. Incomplete scans/caps are reported by the catalog command;
# they do NOT establish exhaustive Ticketmaster.nl coverage. Exhaustive country
# discovery needs date/location partitioning beyond this initial bounded query.
# The source's public-sale/presale schedules are metadata, never available stock.
# No priority inventory scheduler or automatic multi-channel routing is enabled
# by this configuration. With a 60s host interval, 1,000 event pages can take over
# 16 hours per sweep; a 60s event interval is not a per-event freshness promise.
database = "data/ticket-nl.sqlite"
per_host_interval_secs = 60
blocked_retry_secs = 900
unknown_retry_secs = 120
max_in_flight = 2

[catalog]
refresh_interval_secs = 900
max_requests_per_refresh = 10
max_requests_per_day = 4000
max_events = 1000

[browser]
script = "browser/worker.cjs"

[discord]
token_env = "DISCORD_BOT_TOKEN"
# Set a reviewed destination ID before using run --send-discord.
# channel_id = "YOUR_NUMERIC_CHANNEL_ID"
mention_user_ids = []
mention_role_ids = []

[[subscriptions]]
id = "netherlands-all-artists"
all_artists = true
country = "NL"
profile = "ticketmaster-nl"
enabled = true
# Optional city narrows the query; no attraction_id is permitted in this mode.
# city = "Amsterdam"
# No title exclusions: sports, festivals and other returned event types can also
# appear, including events whose artist metadata is not supplied.
exclude_keywords = []

[[profiles]]
id = "ticketmaster-nl"
hosts = ["www.ticketmaster.nl", "ticketmaster.nl"]
mode = "browser"
interval_secs = 60
notify_initial = false
notify_offer_changes = true

[profiles.parser]
adapter = "ticketmaster"
# Unknown layouts and blocked pages remain unknown, not sold out.
